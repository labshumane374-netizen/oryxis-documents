<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lettre jaunie — Samuel Pryce</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Nothing+You+Could+Do&family=Kalam:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #F5EDD8;
    --paper-dark: #EEE0C0;
    --ink: #2C1810;
    --ink-light: #5C3A22;
    --ink-faint: #8A6A48;
    --border: #C4AE88;
    --gold: #9A7A50;
    --green: #4A6B3A;
    --red: #8B3A2A;
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IM Fell English', Georgia, serif;
  }

  #scene {
    perspective: 2000px;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  #book-wrapper {
    position: relative;
    width: 860px; height: 620px;
    transform-style: preserve-3d;
  }

  #cover-container {
    position: absolute;
    width: 430px; height: 620px;
    left: 215px;
    transform-origin: left center;
    transform-style: preserve-3d;
    z-index: 100;
    cursor: pointer;
    transition: filter 0.3s;
  }
  #cover-container:hover { filter: brightness(1.06); }

  .cover-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 2px 5px 5px 2px;
    overflow: hidden;
  }
  .cover-front {
    background: transparent;
    border: none;
    box-shadow: none;
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0;
  }
  .cover-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-back {
    transform: rotateY(180deg);
    background: var(--paper);
    border: 1px solid #9A7A50;
    box-shadow: inset 8px 0 24px rgba(0,0,0,0.10);
    overflow: hidden;
  }
  /* la face arrière de la couverture porte le contenu de la page de gauche :
     en pivotant, elle « devient » la première page, comme un vrai livre */
  #cover-back-content { width: 100%; height: 100%; }

  .cover-click-hint {
    position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%);
    font-family: 'IM Fell English SC', serif; font-size: 10px;
    color: #9A7A50; letter-spacing: 2px;
    animation: pulse-hint 2.5s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes pulse-hint { 0%,100%{ opacity:0.3; } 50%{ opacity:0.9; } }

  .cover-spine {
    position: absolute;
    left: -14px; top: 0; width: 14px; height: 620px;
    background: linear-gradient(90deg, #7A5A38, #9A7A50, #7A5A38);
    border-left: 1px solid #6A4A28;
    border-right: 1px solid #C4AE88;
    transform: rotateY(-90deg) translateX(-7px);
    transform-origin: right center;
  }

  #pages-stack {
    position: absolute;
    left: 50%; top: 0;
    width: 430px; height: 620px;
    background: linear-gradient(90deg, #d8c8a8, #F5EDD8 10%, #ede0c4 90%, #c8b890);
    border-radius: 0 5px 5px 0;
    box-shadow: 6px 4px 20px rgba(0,0,0,0.35);
    overflow: hidden;
    display: none;
  }

  #left-page {
    position: absolute;
    left: 0; top: 0;
    width: 430px; height: 620px;
    background: var(--paper);
    border-right: 1px solid #C4AE88;
    overflow: hidden;
    box-shadow: inset -6px 0 12px rgba(0,0,0,0.04);
    display: none;
  }

  #flip-container {
    position: absolute;
    left: 50%; top: 0;
    width: 430px; height: 620px;
    transform-origin: left center;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    z-index: 10;
    pointer-events: none;
    display: none;
  }

  .flip-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    overflow: hidden;
  }
  #flip-front { background: var(--paper); box-shadow: inset -4px 0 12px rgba(0,0,0,0.05); }
  #flip-back  { background: var(--paper); transform: rotateY(180deg); box-shadow: inset 4px 0 12px rgba(0,0,0,0.05); }

  .page-content {
    width: 100%; height: 100%;
    padding: 28px 34px 22px;
    position: relative;
    display: flex; flex-direction: column;
    background: var(--paper);
    overflow: hidden;
  }

  .page-num {
    position: absolute; bottom: 10px;
    font-family: 'IM Fell English SC', serif; font-size: 9px;
    color: var(--gold); letter-spacing: 1px;
  }
  .page-num.left  { left: 26px; }
  .page-num.right { right: 26px; }

  /* ——— TYPOGRAPHIE PAGES ——— */
  .sec-title {
    font-family: 'IM Fell English SC', serif;
    font-size: 11px; letter-spacing: 0.14em;
    color: var(--ink);
    text-align: center;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .plant-name {
    font-family: 'IM Fell English SC', serif;
    font-size: 16px; color: var(--ink);
    margin-bottom: 2px;
  }

  .latin-name {
    font-style: italic; font-size: 11px;
    color: var(--green); font-weight: normal;
    margin-bottom: 11px;
  }

  .body-text {
    font-size: 11.5px; line-height: 1.78;
    color: var(--ink); margin-bottom: 7px;
    text-align: justify; hyphens: auto;
  }
  .body-text + .body-text { text-indent: 1.2em; }

  .drop-cap::first-letter {
    font-family: 'IM Fell English SC', serif;
    font-size: 3.2rem;
    float: left; line-height: 0.76;
    margin: 0.06rem 0.4rem 0 0;
    color: var(--ink-light);
  }

  .marginal {
    font-family: 'Kalam', cursive;
    font-size: 11px; color: var(--ink);
    margin: 6px 0;
    padding-left: 9px;
    border-left: 2px solid #C8A878;
    line-height: 1.52;
  }

  .prop-label {
    display: block;
    font-family: 'IM Fell English SC', serif;
    font-size: 9px; letter-spacing: 0.14em;
    color: var(--ink-light);
    margin: 8px 0 3px;
  }

  .prop-text {
    font-size: 10.5px; line-height: 1.72;
    color: var(--ink); margin: 0 0 4px;
    text-indent: 0 !important;
  }

  .warning {
    font-style: italic; color: var(--red);
    padding: 6px 10px;
    border-left: 2px solid var(--red);
    margin: 6px 0; font-size: 10px;
    line-height: 1.62; text-indent: 0 !important;
  }

  .rite-block {
    background: rgba(0,0,0,0.022);
    border: 1px solid var(--border);
    padding: 11px 14px;
    margin: 8px 0;
  }
  .rite-block h4 {
    font-family: 'IM Fell English SC', serif;
    font-size: 9.5px; letter-spacing: 0.16em;
    color: var(--red); margin-bottom: 4px;
  }
  .rite-intro {
    font-style: italic; font-size: 9px;
    color: var(--ink-faint); margin-bottom: 7px;
    text-indent: 0 !important; line-height: 1.58;
  }

  .torn {
    background: var(--paper-dark);
    border: 1px solid var(--border);
    border-top: 2px solid var(--border);
    padding: 10px 13px 15px;
    margin: 8px 0;
    font-family: 'Kalam', cursive;
    font-size: 11.5px; color: var(--ink);
    line-height: 1.65; position: relative;
  }
  .torn::after {
    content: '— [ pages arrachées — transmission incomplète ] —';
    display: block; font-style: italic;
    color: var(--gold); font-size: 8.5px;
    margin-top: 7px; padding-top: 7px;
    border-top: 1px dashed var(--border);
    text-align: center; letter-spacing: 0.05em;
  }

  .law-item {
    display: flex; gap: 8px;
    margin-bottom: 8px; align-items: flex-start;
  }
  .law-num {
    font-family: 'IM Fell English SC', serif;
    font-size: 12px; color: var(--gold);
    min-width: 18px; padding-top: 0.02rem; flex-shrink: 0;
  }
  .law-text {
    font-size: 10.5px; line-height: 1.72; color: var(--ink);
  }
  .law-text.incomplete { font-style: italic; color: #7A5A40; }

  .toc-row {
    display: flex; justify-content: space-between;
    align-items: baseline; padding: 3.5px 0;
    border-bottom: 1px dotted var(--border);
    font-size: 10.5px;
  }
  .toc-row:last-child { border-bottom: none; }
  .toc-row.sub { padding-left: 10px; font-style: italic; font-size: 9.5px; color: #6A5040; }
  .toc-page {
    font-family: 'IM Fell English SC', serif;
    font-size: 9px; color: var(--gold);
    margin-left: 4px; flex-shrink: 0;
  }

  .illus-r {
    float: right; margin: 0 0 8px 14px;
    padding: 5px 5px 3px;
    border: 1px solid var(--border);
    background: rgba(245,237,216,0.5);
  }
  .illus-cap {
    font-size: 8px; font-style: italic;
    color: #7A5A40; text-align: center;
    margin-top: 4px;
    font-family: 'Kalam', cursive; line-height: 1.38;
  }

  .letter { font-family: 'Nothing You Could Do', cursive; font-size: 11.5px; line-height: 1.75; color: #1E3A6A; }
  .letter p { font-family: 'Nothing You Could Do', cursive; font-size: 11.5px; text-align: left; text-indent: 0; margin-bottom: 6px; color: #1E3A6A; }
  .letter em { color: #2A5090; }
  .signature {
    font-family: 'Nothing You Could Do', cursive; font-size: 13px;
    color: #1E3A6A; text-align: right;
    margin-top: 10px; line-height: 1.5;
  }

  .pf {
    font-family: 'IM Fell English SC', serif;
    font-size: 8px; color: #A08060; letter-spacing: 0.09em;
    text-align: center; padding-top: 9px; margin-top: auto;
    border-top: 1px solid var(--border);
  }

  .divider { text-align: center; color: var(--gold); margin: 8px 0; letter-spacing: 0.5rem; font-size: 10px; }

  .clearfix::after { content:''; display:table; clear:both; }

  /* ——— COVER ——— */
  .cv-title {
    font-family: 'IM Fell English SC', serif;
    font-size: 20px; color: var(--ink);
    letter-spacing: 0.03em; line-height: 1.3;
    text-align: center; margin-bottom: 10px;
  }
  .cv-rule { width: 60px; height: 1px; background: var(--gold); margin: 10px auto; }
  .cv-subtitle {
    font-style: italic; font-size: 10.5px;
    color: var(--ink-light); line-height: 1.65; text-align: center;
  }
  .cv-author {
    font-family: 'IM Fell English SC', serif;
    font-size: 12px; color: var(--ink-light);
    letter-spacing: 0.07em; margin-top: 10px; text-align: center;
  }
  .cv-origin { font-size: 9.5px; font-style: italic; color: var(--ink-faint); text-align: center; }

  .bordered-frame {
    border: 1px solid var(--gold);
    padding: 18px 16px; position: relative; width: 100%;
  }
  .cc { position:absolute; width:14px; height:14px; border-color:var(--gold); border-style:solid; }
  .cc-tl { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .cc-tr { top:-1px; right:-1px; border-width:2px 2px 0 0; }
  .cc-bl { bottom:-1px; left:-1px; border-width:0 0 2px 2px; }
  .cc-br { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  /* ——— NAV ——— */
  #nav-prev, #nav-next {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: rgba(26,16,8,0.25);
    border: 1px solid #9A7A50;
    color: #C4AE88;
    width: 42px; height: 70px;
    cursor: pointer; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; z-index: 1000;
    font-family: serif; user-select: none;
  }
  #nav-prev { left: calc(50% - 450px); border-radius: 6px 0 0 6px; }
  #nav-next { right: calc(50% - 450px); border-radius: 0 6px 6px 0; }
  #nav-prev:hover, #nav-next:hover { background: rgba(26,16,8,0.55); color: #F5EDD8; }
  #nav-prev.hidden, #nav-next.hidden { opacity:0; pointer-events:none; }

  #page-indicator {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: 'IM Fell English SC', serif; font-size: 10px;
    color: #9A7A50; letter-spacing: 2px;
    white-space: nowrap; z-index: 1000;
  }

  #cover-container.opening {
    animation: cover-open 1.35s cubic-bezier(0.46, 0.03, 0.30, 1) forwards;
    pointer-events: none;
  }
  @keyframes cover-open {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(-178deg); }
  }
  #cover-container.opened {
    transform: rotateY(-178deg);
    pointer-events: none;
  }

  /* ombre de tranche renforcée pendant l'ouverture, pour la profondeur */
  .cover-front { transition: box-shadow 0.4s; }
  #cover-container.opening .cover-front {
    box-shadow: 14px 0 40px rgba(0,0,0,0.55), inset -3px 0 10px rgba(0,0,0,0.08);
  }

  /* apparition en fondu de la moitié droite une fois la couverture ouverte */
  #pages-stack.revealing, #flip-container.revealing {
    animation: half-reveal 0.5s ease-out forwards;
  }
  @keyframes half-reveal {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }

  /* ——— Lettre de Samuel Pryce ——— */
  :root { --paper:#EADBB4; --border:#C9B088; }
  .page-content { background:
      radial-gradient(ellipse 45% 30% at 15% 10%, rgba(168,118,58,.16), transparent 70%),
      radial-gradient(ellipse 40% 30% at 90% 92%, rgba(122,75,28,.20), transparent 70%),
      linear-gradient(transparent 49.7%, rgba(90,58,26,.10) 50%, transparent 50.3%),
      var(--paper) !important; padding: 34px 36px 22px; }
  .lp { font-family:'Kalam', cursive; font-size:13px; line-height:1.62; color:#3A2716; margin-bottom:7px; }
  .lp em { font-style:normal; color:#5A3A1E; }
  .ldate { font-family:'Kalam', cursive; font-size:12.5px; color:#5A3A1E; text-align:right; margin-bottom:12px; }
  .lsign { font-family:'Nothing You Could Do', cursive; font-size:17px; color:#3A2716; text-align:right; margin:10px 0 14px; }
  .lps { font-family:'Kalam', cursive; font-size:12px; line-height:1.55; color:#6A2A1A; transform:rotate(-1.2deg); margin-top:6px; }
  .pf { color:#9A7A50; border-top:1px solid rgba(154,122,80,.35); }
  .cover-spine { display:none; }
  #cover-container { filter:drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
  #cover-container:hover { filter:drop-shadow(0 18px 30px rgba(0,0,0,.45)) brightness(1.05); }
  .enveloppe { position:absolute; inset:0; background:
      radial-gradient(ellipse 50% 35% at 80% 15%, rgba(122,75,28,.22), transparent 70%),
      radial-gradient(ellipse 40% 30% at 20% 85%, rgba(168,118,58,.25), transparent 70%),
      radial-gradient(circle at 30% 40%, rgba(122,75,28,.10) 0 4%, transparent 8%),
      linear-gradient(transparent 33.1%, rgba(90,58,26,.16) 33.3%, transparent 33.6%),
      linear-gradient(transparent 66.4%, rgba(90,58,26,.16) 66.6%, transparent 66.9%),
      #E3D1A4; box-shadow: inset 0 0 60px rgba(110,70,30,.35); border-radius:2px; }
  .adresse { position:absolute; left:70px; right:40px; top:250px; font-family:'Nothing You Could Do', cursive; color:#3A2716; font-size:21px; line-height:1.7; transform:rotate(-3deg); }
  .adresse small { display:block; font-size:16px; color:#5A3A1E; }
  .mention { position:absolute; left:40px; top:60px; font-family:'Kalam', cursive; font-size:13px; color:#6A4A28; transform:rotate(-2deg); }
  .cachet { position:absolute; left:50%; top:470px; width:86px; height:86px; margin-left:-43px; border-radius:46% 54% 50% 50%;
      background: radial-gradient(circle at 38% 35%, #b5463a, #7c1f17 62%, #5a140f);
      box-shadow: 0 3px 6px rgba(0,0,0,.45), inset 0 -4px 8px rgba(0,0,0,.35);
      display:flex; align-items:center; justify-content:center; font-family:'IM Fell English SC', serif; font-size:24px; color:rgba(255,220,200,.55); text-shadow:0 -1px 0 rgba(0,0,0,.4); }
  .cachet::after { content:''; position:absolute; inset:9px; border-radius:50%; border:2px solid rgba(60,10,8,.45); }
</style>
</head>
<body>
<div id="scene">
  <div id="book-wrapper">

    <div id="left-page">
      <div class="page-content" id="left-content"></div>
    </div>

    <div id="pages-stack"><div id="pages-stack-content" class="page-content" style="background:var(--paper);"></div></div>

    <div id="flip-container">
      <div class="flip-face" id="flip-front">
        <div class="page-content" id="flip-front-content"></div>
      </div>
      <div class="flip-face" id="flip-back">
        <div class="page-content" id="flip-back-content"></div>
      </div>
    </div>

    <!-- COVER -->
    <div id="cover-container">
      <div class="cover-face cover-front">
        <div class="enveloppe"></div><div class="mention">Mont Gordo, nov. 1859</div><div class="adresse">Mrs Mary Pryce<small>au village, sous le Mont Gordo<br>comté de Blaine</small></div><div class="cachet">SP</div>
      </div>

      <div class="cover-face cover-back">
        <div class="page-content" id="cover-back-content"></div>
      </div>

      <div class="cover-spine"></div>
      <div class="cover-click-hint">· Déplier la lettre ·</div>
    </div>

  </div>
</div>
<button id="nav-prev" class="hidden" onclick="flipPrev()">&#8249;</button>
<button id="nav-next" class="hidden" onclick="flipNext()">&#8250;</button>
<div id="page-indicator"></div>

<script>
const spreads = [
  {
    left: `<div class="ldate">Mont Gordo, le 14 novembre 1859</div>
<p class="lp">Ma chère Mary,</p>
<p class="lp">Je t'écris à la lueur de la lanterne, au fond de la galerie, parce qu'ici au moins le contremaître ne regarde pas. Le papier est humide et ma main n'est plus bien sûre, pardonne-moi si tu as du mal à me lire.</p>
<p class="lp">Je t'avais promis de rentrer pour Noël. Je ne crois plus que je rentrerai. M. Harlow ne nous laisse plus descendre au village. Il dit que l'ouvrage presse, que l'hiver va fermer le col et qu'il paiera double ceux qui restent. Il paie, c'est vrai. Mais je donnerais tout cet argent pour être à la maison avec toi et la petite.</p>
<p class="lp">Il faut que je te dise ce qui se passe ici, parce que je n'ai personne d'autre à qui le dire.</p>
<p class="lp">On ne cherche pas d'or. Il n'y en a pas, et M. Harlow le sait mieux que nous. Il nous fait creuser vers la pierre qui est tombée du ciel il y a deux ans. Elle est là, Mary, sous la montagne, au bord du lac. Je l'ai vue de mes yeux. Elle est noire et grosse comme une charrette, et quand on approche la lanterne, on dirait qu'il y a des veines qui brillent dedans, comme des braises sous la cendre.</p>
<p class="lp">Elle est chaude. En plein hiver, sous la terre, elle est chaude.</p>
<div class="pf">Lettre de Samuel Pryce · 1</div>`,
    right: `<p class="lp">M. Harlow passe des heures assis devant elle. Il écrit dans son carnet. Parfois il lui parle, à voix basse. Le vieux Ezra, qui a la meilleure oreille de nous tous, jure qu'une nuit il a entendu la pierre lui répondre. Je ne veux pas croire ça. Mais je n'arrive plus à dormir.</p>
<p class="lp">Il y a trois jours, M. Harlow a demandé un homme pour descendre au fond de la salle, là où la roche est fendue derrière la pierre. Personne ne voulait. Thomas a dit oui, parce qu'il a trois enfants et que M. Harlow promettait un mois de gages.</p>
<p class="lp">On l'a attaché à une corde. On l'a descendu. Au bout d'un moment, la corde est devenue légère. On l'a remontée. Elle n'était pas coupée, Mary. Le nœud était défait, proprement, comme si quelqu'un l'avait dénoué avec soin.</p>
<p class="lp">On a voulu redescendre le chercher. M. Harlow nous en a empêchés. Il a dit, je te le jure sur la tête de notre fille : <em>« Laissez-le. Il est passé. Il est le premier. »</em></p>
<p class="lp">Le premier de quoi ? Il n'a pas voulu répondre.</p>
<p class="lp">Depuis, il nous fait faire des travaux qui n'ont aucun sens pour une mine. Une grille de fer forgé à l'entrée, avec une serrure pour laquelle il n'existe qu'une clé, et il la garde sur lui. Des bornes de pierre au fond des galeries, avec des disques gravés de signes que personne ne sait lire. Une</p>
<div class="pf">Lettre de Samuel Pryce · 2</div>`
  },
  {
    left: `<p class="lp suite">dalle énorme pendue à quatre chaînes au-dessus d'un coffre de fer, avec quatre treuils qu'il faut tourner ensemble.</p>
<p class="lp">Je lui ai demandé un jour pourquoi tant de peine pour garder un coffre. Il a souri. Il a dit : <em>« Ce n'est pas pour le garder. C'est pour choisir ceux qui l'ouvriront. Il faudra qu'ils soient plusieurs, qu'ils se fassent confiance, et qu'ils aient très envie de ce qu'il y a dedans. »</em></p>
<p class="lp">Il a fait frapper par un orfèvre un médaillon d'or qu'il porte sous sa chemise. Il ne le quitte jamais. Il l'appelle <em>la clé de la porte</em>.</p>
<p class="lp">Hier, il a fait sortir tous les hommes de la galerie du fond sauf trois. Il a fait porter de la poudre là-bas. Il a dit que c'était pour consolider. Je ne suis pas mineur depuis vingt ans sans savoir qu'on ne consolide pas une voûte avec de la poudre.</p>
<p class="lp">Mary, je crois qu'il ne compte pas que nous redescendions tous.</p>
<p class="lp">Je crois aussi qu'il ne compte pas mourir. Il a dit à Ezra, un soir qu'il avait bu : <em>« Les hommes qui fondent une ville n'ont pas le droit de la quitter. Je partirai devant, et quand le ciel retrouvera mon heure, je reviendrai la reprendre. »</em></p>
<div class="pf">Lettre de Samuel Pryce · 3</div>`,
    right: `<p class="lp">Je vais essayer de la confier au charretier qui monte le bois mardi. Si elle ne te parvient pas, c'est qu'elle sera restée ici, sous la montagne, avec moi.</p>
<p class="lp">Ne laisse jamais personne dire que M. Harlow était un grand homme. Il a fait de grandes choses, c'est vrai. Mais il les a faites avec la vie des autres.</p>
<p class="lp">Embrasse la petite pour moi. Dis-lui que son père pensait à elle au fond de la terre, et qu'il voyait les étoiles quand même, dans l'eau du lac, chaque fois qu'il sortait prendre l'air.</p>
<p class="lp">Je t'aime de tout mon cœur.</p>
<div class="lsign">Samuel Pryce</div>
<p class="lps">P.-S. Si quelqu'un d'autre que toi lit ceci un jour : n'ouvrez pas le coffre. Ou si vous l'ouvrez, sortez vite.</p>
<div class="pf">Lettre de Samuel Pryce · 4</div>`
  }
];

let currentSpread = 0;
let isOpen = false;
let isAnimating = false;
const TOTAL_SPREADS = spreads.length;

const cover         = document.getElementById('cover-container');
const flipContainer = document.getElementById('flip-container');
const flipFront     = document.getElementById('flip-front-content');
const flipBack      = document.getElementById('flip-back-content');
const leftContent   = document.getElementById('left-content');
const navPrev       = document.getElementById('nav-prev');
const navNext       = document.getElementById('nav-next');
const indicator     = document.getElementById('page-indicator');

function renderSpread(index) {
  const s = spreads[index];
  leftContent.innerHTML = s.left;
  flipFront.innerHTML   = s.right;
  document.getElementById('pages-stack-content').innerHTML =
    (index + 1 < TOTAL_SPREADS) ? spreads[index + 1].right : '';
  if (index + 1 < TOTAL_SPREADS) {
    flipBack.innerHTML = spreads[index + 1].left;
  } else {
    flipBack.innerHTML = '<div class="page-content" style="display:flex;align-items:center;justify-content:center;height:100%;"><div style="font-family:\'IM Fell English SC\',serif;font-size:13px;color:#9A7A50;letter-spacing:3px;text-align:center;">Fin de la lettre</div></div>';
  }
  updateNav();
  updateIndicator();
}

function updateNav() {
  navPrev.classList.toggle('hidden', currentSpread <= 0);
  navNext.classList.toggle('hidden', currentSpread >= TOTAL_SPREADS - 1);
}

function updateIndicator() {
  if (!isOpen) { indicator.style.display = 'none'; return; }
  indicator.style.display = 'block';
  indicator.textContent = 'Pages ' + (currentSpread * 2 + 1) + '–' + (currentSpread * 2 + 2) + ' / ' + (TOTAL_SPREADS * 2);
}

function openBook() {
  if (isOpen || isAnimating) return;
  isAnimating = true;

  // Préparer le contenu.
  leftContent.innerHTML = spreads[0].left;
  flipFront.innerHTML   = spreads[0].right;
  document.getElementById('pages-stack-content').innerHTML = (1 < spreads.length) ? spreads[1].right : '';
  flipBack.innerHTML = (1 < spreads.length) ? spreads[1].left : '';

  // La face ARRIÈRE de la couverture porte le sommaire (page de gauche).
  // En pivotant, la couverture « devient » la première page — comme un vrai
  // livre. Tout le reste (left-page réel, pile, flip) reste caché pendant
  // l'ouverture : aucune superposition possible.
  document.getElementById('cover-back-content').innerHTML = spreads[0].left;
  document.getElementById('left-page').style.display   = 'none';
  document.getElementById('pages-stack').style.display = 'none';
  flipContainer.style.display = 'none';

  cover.querySelector('.cover-click-hint').style.display = 'none';
  cover.classList.add('opening');

  setTimeout(function() {
    // La couverture est repliée à plat. On affiche le vrai livre dessous
    // (la page de gauche a un contenu identique au dos de la couverture,
    // donc le remplacement est invisible) puis on retire la couverture.
    var leftPage = document.getElementById('left-page');
    var stack = document.getElementById('pages-stack');
    leftPage.style.display = 'block';
    stack.style.display = 'block';
    flipContainer.style.display = 'block';
    cover.classList.remove('opening');
    cover.classList.add('opened');
    cover.style.display = 'none';
    // léger fondu de la moitié droite, révélée par l'écartement du livre
    stack.classList.add('revealing');
    flipContainer.classList.add('revealing');
    setTimeout(function() {
      stack.classList.remove('revealing');
      flipContainer.classList.remove('revealing');
    }, 460);
    isOpen = true; isAnimating = false;
    currentSpread = 0;
    updateNav();
    navPrev.classList.add('hidden');
    navNext.classList.remove('hidden');
    indicator.style.display = 'block';
    updateIndicator();
  }, 1350);
}

const END_PAGE = '<div class="page-content" style="display:flex;align-items:center;justify-content:center;height:100%;"><div style="font-family:\'IM Fell English SC\',serif;font-size:13px;color:#9A7A50;letter-spacing:3px;text-align:center;">Fin de la lettre</div></div>';

function doFlip(direction) {
  if (!isOpen || isAnimating) return;
  if (direction === 'next' && currentSpread >= TOTAL_SPREADS - 1) return;
  if (direction === 'prev' && currentSpread <= 0) return;

  isAnimating = true;
  navPrev.classList.add('hidden');
  navNext.classList.add('hidden');
  flipContainer.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000)';

  if (direction === 'next') {
    // flip-front shows current right page; flip-back shows next left page.
    // pages-stack underneath shows the next right page so it appears once the flip lands.
    flipFront.innerHTML = spreads[currentSpread].right;
    flipBack.innerHTML  = (currentSpread + 1 < TOTAL_SPREADS) ? spreads[currentSpread + 1].left : END_PAGE;
    document.getElementById('pages-stack-content').innerHTML =
      (currentSpread + 1 < TOTAL_SPREADS) ? spreads[currentSpread + 1].right : '';
    flipContainer.style.transform = 'rotateY(-180deg)';
    setTimeout(function() {
      currentSpread++;
      flipContainer.style.transition = 'none';
      flipContainer.style.transform = 'rotateY(0deg)';
      renderSpread(currentSpread);
      isAnimating = false;
    }, 920);
  } else {
    // Going back: the left page stays visible; the flip element rotates from
    // 180deg back to 0deg. flip-back (visible at 180deg) must show the previous
    // right page; flip-front (visible at 0deg) shows the previous right page too.
    document.getElementById('pages-stack-content').innerHTML = spreads[currentSpread].right;
    leftContent.innerHTML = spreads[currentSpread - 1].left;
    flipFront.innerHTML   = spreads[currentSpread].left;
    flipBack.innerHTML    = spreads[currentSpread - 1].right;
    flipContainer.style.transition = 'none';
    flipContainer.style.left = 'auto';
    flipContainer.style.right = '50%';
    flipContainer.style.transformOrigin = 'right center';
    flipContainer.style.transform = 'rotateY(0deg)';
    void flipContainer.offsetWidth;
    flipContainer.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000)';
    requestAnimationFrame(function() {
      flipContainer.style.transform = 'rotateY(180deg)';
    });
    setTimeout(function() {
      currentSpread--;
      flipContainer.style.transition = 'none';
      flipContainer.style.left = '50%';
      flipContainer.style.right = 'auto';
      flipContainer.style.transformOrigin = 'left center';
      flipContainer.style.transform = 'rotateY(0deg)';
      renderSpread(currentSpread);
      isAnimating = false;
    }, 920);
  }
}

function flipNext() { doFlip('next'); }
function flipPrev() { doFlip('prev'); }

cover.addEventListener('click', openBook);

document.addEventListener('keydown', function(e) {
  if (!isOpen) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') flipNext();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   flipPrev();
});

flipFront.innerHTML   = '';
flipBack.innerHTML    = '';
leftContent.innerHTML = '';
</script>
</body>
</html>
